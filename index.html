<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社畜觀察日記 v3</title>
  <style>
    :root {
      --wall-day: #fdf6e3;
      --wall-evening: #fce4d6;
      --wall-night: #1e2436;
      --floor-day: #deb887;
      --floor-night: #5d4037;
      --text-main: #2d3436;
      --primary: #0984e3;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body {
      margin: 0;
      background-color: #2d3436;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .game-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      background: var(--wall-day);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 35px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
      transition: background 0.8s ease;
    }
    .game-container.evening { background: var(--wall-evening); }
    .game-container.night { background: var(--wall-night); color: #f5f6fa; }

    /* 時事跑馬燈 */
    .news-banner {
      background: #ff7675;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 20;
    }

    /* 頂部狀態列 */
    .top-bar {
      background: rgba(255, 255, 255, 0.95);
      color: var(--text-main);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      z-index: 20;
    }
    .stat-group { display: flex; gap: 6px; font-size: 12px; font-weight: 700; }
    .stat-badge { background: #f1f2f6; padding: 4px 8px; border-radius: 12px; }

    /* 時間與測試控制列 */
    .time-bar {
      background: rgba(0,0,0,0.06);
      padding: 6px 14px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .night .time-bar { background: rgba(255,255,255,0.1); }
    .btn-sim {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-sim:active { transform: scale(0.95); }

    /* 互動房間主場景 */
    .room-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    /* 窗戶 (隨日夜變色) */
    .room-window {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 96px;
      height: 84px;
      background: #74b9ff;
      border: 5px solid #8d6e63;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.15);
      transition: background 0.8s ease;
    }
    .evening .room-window { background: #fab1a0; }
    .night .room-window { background: #0c2461; }
    .window-cross-h { position: absolute; width: 100%; height: 4px; background: #8d6e63; }
    .window-cross-v { position: absolute; height: 100%; width: 4px; background: #8d6e63; }

    /* 戰利品展示架 */
    .room-decor {
      position: absolute;
      top: 20px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      z-index: 5;
    }
    .decor-tag {
      background: rgba(255,255,255,0.92);
      color: #2d3436;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    /* 房間木地板 */
    .room-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 46%;
      background: repeating-linear-gradient(
        0deg,
        var(--floor-day),
        var(--floor-day) 24px,
        #d2a679 25px,
        #d2a679 26px
      );
      border-top: 4px solid #8d6e63;
      transition: background 0.8s ease;
    }
    .night .room-floor {
      background: repeating-linear-gradient(
        0deg,
        var(--floor-night),
        var(--floor-night) 24px,
        #4e342e 25px,
        #4e342e 26px
      );
    }

    /* 固定家具擺設 */
    .furniture {
      position: absolute;
      font-size: 46px;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
      pointer-events: none;
    }
    .furn-bed { bottom: 135px; left: 18px; font-size: 54px; }
    .furn-desk { bottom: 140px; right: 22px; font-size: 48px; }
    .furn-tv { bottom: 25px; left: 24px; font-size: 46px; }
    .furn-console {
      bottom: 18px;
      left: 72px;
      font-size: 24px;
      display: none;
      animation: pulseGlow 1.5s infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: scale(1); filter: drop-shadow(0 0 2px #00cec9); }
      to { transform: scale(1.12); filter: drop-shadow(0 0 8px #0984e3); }
    }

    /* 會走動的水豚角色容器 */
    .capybara-actor {
      position: absolute;
      left: 50%;
      bottom: 75px;
      transform: translate(-50%, 0);
      transition: left 2.2s linear, bottom 2.2s linear;
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    /* 頭頂小氣泡 */
    .thought-bubble {
      background: rgba(255, 255, 255, 0.96);
      color: #2d3436;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      margin-bottom: 6px;
      position: relative;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thought-bubble::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: rgba(255,255,255,0.96) transparent transparent;
    }

    /* 水豚本體與走路搖擺動畫 */
    .capybara-sprite {
      font-size: 64px;
      line-height: 1;
      filter: drop-shadow(0 6px 6px rgba(0,0,0,0.25));
      transition: transform 0.2s ease;
    }
    .capybara-sprite.facing-right { transform: scaleX(-1); }
    .capybara-sprite.walking {
      animation: waddle 0.35s infinite alternate ease-in-out;
    }
    .capybara-sprite.facing-right.walking {
      animation: waddleRight 0.35s infinite alternate ease-in-out;
    }
    @keyframes waddle {
      0% { transform: translateY(0px) rotate(-4deg); }
      100% { transform: translateY(-6px) rotate(4deg); }
    }
    @keyframes waddleRight {
      0% { transform: scaleX(-1) translateY(0px) rotate(-4deg); }
      100% { transform: scaleX(-1) translateY(-6px) rotate(4deg); }
    }

    /* 點擊愛心特效 */
    .heart-pop {
      position: absolute;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 30;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-45px) scale(1.3); }
    }

    /* 底部狀態文字條 */
    .status-strip {
      background: rgba(255,255,255,0.92);
      color: #2d3436;
      margin: 8px 14px 6px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      z-index: 15;
    }

    /* 動態訊息紀錄區 */
    .log-feed {
      height: 125px;
      background: rgba(255,255,255,0.9);
      color: #2d3436;
      margin: 0 14px 10px;
      border-radius: 10px;
      padding: 8px 12px;
      overflow-y: auto;
      font-size: 12px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
      z-index: 15;
    }
    .log-item { margin-bottom: 5px; border-bottom: 1px dashed #dfe6e9; padding-bottom: 4px; }
    .log-time { color: #636e72; font-size: 11px; margin-right: 5px; }

    /* 底部操作列 */
    .bottom-nav {
      background: #ffffff;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      border-top: 1px solid rgba(0,0,0,0.08);
      z-index: 20;
    }
    .nav-btn {
      background: #f1f2f6;
      border: none;
      padding: 10px 6px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #2d3436;
      cursor: pointer;
    }
    .nav-btn:active { background: #dfe6e9; }

    /* 彈窗 Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 50;
    }
    .modal-overlay.show { display: flex; }
    .modal-sheet {
      background: white;
      color: #2d3436;
      width: 100%;
      max-height: 75%;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: bold;
      font-size: 16px;
    }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
    .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .slot-card {
      border: 2px dashed #b2bec3;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 13px;
    }
    .slot-card.filled { border-style: solid; border-color: var(--primary); background: #f0f8ff; }
    .item-list { display: flex; flex-direction: column; gap: 10px; }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border: 1px solid #dfe6e9;
      border-radius: 10px;
    }
    .btn-action {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .postcard-card {
      border: 1px solid #dfe6e9;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fafafa;
    }
  </style>
</head>
<body>

<div class="game-container" id="gameContainer">
  <!-- 動態時事橫幅 -->
  <div class="news-banner" id="uiNewsBanner">📡 正在同步最新職場與時事動態...</div>

  <!-- 頂部數值 -->
  <div class="top-bar">
    <div style="font-weight: bold;">🦫 水豚社畜</div>
    <div class="stat-group">
      <div class="stat-badge" id="uiMood">😊 75</div>
      <div class="stat-badge" id="uiStamina">⚡ 80</div>
      <div class="stat-badge" id="uiMoney">💰 16,000</div>
    </div>
  </div>

  <!-- 時間與測試控制列 -->
  <div class="time-bar">
    <span id="uiClock">載入時間中...</span>
    <div style="display:flex; gap:5px;">
      <button class="btn-sim" onclick="advanceTime(3)">⏩ 快轉 3 小時</button>
      <button class="btn-sim" style="background:#636e72;" onclick="resetSave()">重置</button>
    </div>
  </div>

  <!-- 互動房間場景 -->
  <div class="room-stage" id="roomStage" onclick="handleRoomClick(event)">
    <!-- 窗戶 -->
    <div class="room-window">
      <span id="windowSkyIcon">☀️</span>
      <div class="window-cross-h"></div>
      <div class="window-cross-v"></div>
    </div>

    <!-- 戰利品擺設清單 -->
    <div class="room-decor" id="uiDecor"></div>

    <!-- 地板與家具 -->
    <div class="room-floor"></div>
    <div class="furniture furn-bed" title="社畜單人床">🛏️</div>
    <div class="furniture furn-desk" title="電腦書桌">🖥️</div>
    <div class="furniture furn-tv" title="客廳電視">📺</div>
    <div class="furniture furn-console" id="furnPs5" title="PS5 Pro + GTA 6">🎮</div>

    <!-- 會走動的水豚角色 -->
    <div class="capybara-actor" id="capyActor" onclick="petCapybara(event)">
      <div class="thought-bubble" id="capyBubble">今天也要加油...</div>
      <div class="capybara-sprite" id="capySprite">🦫</div>
    </div>
  </div>

  <!-- 狀態摘要條 -->
  <div class="status-strip" id="uiStatusText">
    提示：點擊地板可以叫水豚走過去，點擊水豚可以摸摸他！
  </div>

  <!-- 即時動態紀錄 -->
  <div class="log-feed" id="uiLogFeed"></div>

  <!-- 底部功能鈕 -->
  <div class="bottom-nav">
    <button class="nav-btn" onclick="openModal('bagModal')">🎒 行前背包</button>
    <button class="nav-btn" onclick="openModal('shopModal')">🛒 便利商店</button>
    <button class="nav-btn" onclick="openModal('albumModal')">📖 社畜寫真 (<span id="uiAlbumCount">0</span>)</button>
  </div>

  <!-- 背包彈窗 -->
  <div class="modal-overlay" id="bagModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span>🎒 行前裝備配置 (出門前生效)</span>
        <button class="close-btn" onclick="closeModal('bagModal')">✕</button>
      </div>
      <div class="slot-grid">
        <div class="slot-card" id="slotFood">
          <div style="color:#636e72; font-size:11px;">今日便當格</div>
          <strong id="slotFoodName">未配置</strong>
        </div>
        <div class="slot-card" id="slotItem">
          <div style="color:#636e72; font-size:11px;">隨身小物格</div>
          <strong id="slotItemName">未配置</strong>
        </div>
      </div>
      <div style="font-size:13px; font-weight:bold; margin-bottom:8px;">點擊下方庫存裝備：</div>
      <div class="item-list" id="inventoryList"></div>
    </div>
  </div>

  <!-- 商店彈窗 -->
  <div class="modal-overlay" id="shopModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span>🛒 24H 社畜補給站</span>
        <button class="close-btn" onclick="closeModal('shopModal')">✕</button>
      </div>
      <div class="item-list" id="shopList"></div>
    </div>
  </div>

  <!-- 相簿彈窗 -->
  <div class="modal-overlay" id="albumModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span>📖 收集到的社畜寫真</span>
        <button class="close-btn" onclick="closeModal('albumModal')">✕</button>
      </div>
      <div id="albumList"></div>
    </div>
  </div>
</div>

<script>
  const CONFIG_URL = './events_config.json';
  const STORAGE_KEY = 'office_animal_v3';

  const ITEMS_DB = {
    food_onigiri: { id: 'food_onigiri', name: '🍙 超商御飯糰', type: 'food', price: 100, desc: '基本飽足，肝力 +5', effects: { stamina: 5, mood: 0, otReduce: 0 } },
    food_bento: { id: 'food_bento', name: '🍱 特製愛心便當', type: 'food', price: 500, desc: '心情 +15，準時下班率 +10%', effects: { stamina: 10, mood: 15, otReduce: 0.10 } },
    food_coffee: { id: 'food_coffee', name: '☕ 雙倍濃縮冰美式', type: 'food', price: 150, desc: '肝力 +20，但心情 -5', effects: { stamina: 20, mood: -5, otReduce: 0.05 } },
    item_guaiguai: { id: 'item_guaiguai', name: '🟢 機房綠色乖乖', type: 'item', price: 80, desc: '防當機神物，加班率 -15%', effects: { otReduce: 0.15, gtaBoost: 1 } },
    item_headphone: { id: 'item_headphone', name: '🎧 降噪耳機', type: 'item', price: 1200, desc: '隔絕無效會議，心情 +5', effects: { mood: 5, otReduce: 0.05, gtaBoost: 1 } },
    item_game_flyer: { id: 'item_game_flyer', name: '🎮 《GTA 6》預購宣傳單', type: 'item', price: 300, desc: '下班衝去買 PS5 玩 GTA 權重 x4！', effects: { otReduce: 0.05, gtaBoost: 4 } }
  };

  let eventsPool = [
    {
      id: 'EVT_GTA6_NIGHT',
      title: '🎮 罪惡都市的狂歡夜！',
      type: 'AFTER_WORK',
      minMood: 65,
      minMoney: 15000,
      baseWeight: 40,
      isGtaEvent: true,
      moneyDelta: -15000,
      moodDelta: 25,
      staminaDelta: -10,
      unlockDecor: '🎮 PS5 Pro + GTA 6',
      avatar: '🦫🎮',
      log: '準時閃人成功！衝去電玩店抱了一台 PS5 與《GTA 6》回家，今晚窩在電視前破關！'
    },
    {
      id: 'EVT_NORMAL_SLEEP',
      title: '🛌 平凡的追劇躺平夜',
      type: 'AFTER_WORK',
      minMood: 0,
      minMoney: 0,
      baseWeight: 35,
      moneyDelta: 0,
      moodDelta: 5,
      staminaDelta: 15,
      avatar: '🦫🛌',
      log: '平安度過一天，洗完澡直接躺平滑手機，這就是社畜最樸實的快樂。'
    }
  ];

  const now = new Date();
  const DEFAULT_STATE = {
    day: 1,
    hour: 8, // 預設從早上 8 點開始方便直接體驗出門前準備
    lastTimestamp: Date.now(),
    mood: 75,
    stamina: 80,
    money: 16000,
    isAtWork: false,
    isOvertimeToday: false,
    equipped: { food: null, item: null },
    inventory: { food_bento: 1, item_game_flyer: 1 },
    decorations: [],
    album: [],
    logs: [{ time: 'Day 1 08:00', text: '早上好！水豚正在房間散步，快幫他準備便當跟小物吧！' }]
  };

  let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(DEFAULT_STATE));

  // 角色位置與自動漫步 AI 狀態
  let actorPos = { x: 50, bottom: 75 }; // x: 18%~82%, bottom: 30px~135px
  let walkTimer = null;
  let stopWalkTimeout = null;

  async function initGame() {
    try {
      const res = await fetch(`${CONFIG_URL}?t=${Date.now()}`);
      if (res.ok) {
        const data = await res.json();
        if (data.events && data.events.length > 0) eventsPool = data.events;
        document.getElementById('uiNewsBanner').textContent = data.active_banner || '💼 社畜生存戰持續進行中';
      } else {
        document.getElementById('uiNewsBanner').textContent = '🔥 本週時事：《GTA 6》熱賣中！準時下班有機率帶回 PS5！';
      }
    } catch (e) {
      document.getElementById('uiNewsBanner').textContent = '🔥 本週時事：《GTA 6》熱賣中！準時下班有機率帶回 PS5！';
    }

    const elapsedMs = Date.now() - (state.lastTimestamp || Date.now());
    const elapsedHours = Math.min(72, Math.floor(elapsedMs / (1000 * 60 * 60)));
    if (elapsedHours >= 1) {
      addLog(`⏳ 離線經過 ${elapsedHours} 小時，已自動結算期間行程。`);
      advanceTime(elapsedHours, false);
    }

    state.lastTimestamp = Date.now();
    saveState();
    startWanderingAI();
  }

  // 水豚自主散步系統
  function startWanderingAI() {
    if (walkTimer) clearInterval(walkTimer);
    walkTimer = setInterval(() => {
      if (state.isAtWork) return; // 出門上班時不移動
      if (state.hour >= 0 && state.hour < 7) {
        // 睡覺時間固定待在床邊
        moveCapybaraTo(26, 125, '呼嚕呼嚕... 💤');
        return;
      }

      // 若已買 PS5 且在晚上，有高機率走到電視機前面打電動
      const hasPs5 = state.decorations.some(d => d.includes('PS5'));
      if (hasPs5 && state.hour >= 18 && Math.random() < 0.6) {
        moveCapybaraTo(32, 35, '《GTA 6》太好玩啦！🎮');
        return;
      }

      // 隨機在房間地板範圍內散步
      const targetX = Math.floor(Math.random() * 62) + 20; // 20% ~ 82%
      const targetBottom = Math.floor(Math.random() * 95) + 32; // 32px ~ 127px
      const thoughts = [
        '在房間伸個懶腰~',
        '今天下班要吃什麼呢？',
        '存錢買新遊戲機！',
        '不想面對明天的會議...',
        '巡視一下領地 🐾'
      ];
      const randomThought = thoughts[Math.floor(Math.random() * thoughts.length)];
      moveCapybaraTo(targetX, targetBottom, randomThought);
    }, 4200);
  }

  function moveCapybaraTo(targetX, targetBottom, thoughtText) {
    const actor = document.getElementById('capyActor');
    const sprite = document.getElementById('capySprite');
    const bubble = document.getElementById('capyBubble');

    // 判斷左右方向並翻轉角色朝向
    if (targetX > actorPos.x) {
      sprite.classList.add('facing-right');
    } else if (targetX < actorPos.x) {
      sprite.classList.remove('facing-right');
    }

    actorPos = { x: targetX, bottom: targetBottom };
    actor.style.left = `${targetX}%`;
    actor.style.bottom = `${targetBottom}px`;

    sprite.classList.add('walking');
    if (thoughtText) bubble.textContent = thoughtText;

    if (stopWalkTimeout) clearTimeout(stopWalkTimeout);
    stopWalkTimeout = setTimeout(() => {
      sprite.classList.remove('walking');
    }, 2200);
  }

  // 點擊房間地板叫水豚走過去
  function handleRoomClick(e) {
    if (state.isAtWork) return;
    const stage = document.getElementById('roomStage');
    const rect = stage.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    // 限制只能在地板區域 (下半部) 走動
    const fromBottom = rect.height - clickY;
    if (fromBottom > 155 || fromBottom < 20) return;

    const pctX = Math.min(82, Math.max(18, (clickX / rect.width) * 100));
    moveCapybaraTo(pctX, fromBottom, '噠噠噠！跑過來了~');
  }

  // 點擊水豚撫摸互動
  let lastPetTime = 0;
  function petCapybara(e) {
    e.stopPropagation();
    if (state.isAtWork) return;

    // 冒出愛心特效
    const stage = document.getElementById('roomStage');
    const heart = document.createElement('div');
    heart.className = 'heart-pop';
    heart.textContent = '❤️';
    heart.style.left = `${actorPos.x}%`;
    heart.style.bottom = `${actorPos.bottom + 65}px`;
    stage.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);

    document.getElementById('capyBubble').textContent = '被摸頭好舒服～ (心情上升)';

    // 每 10 秒最多加一次心情避免無限刷
    if (Date.now() - lastPetTime > 10000) {
      lastPetTime = Date.now();
      state.mood = Math.min(100, state.mood + 2);
      saveState();
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    renderUI();
  }

  function resetSave() {
    if (!confirm('確定要重置所有存檔進度嗎？')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    state.lastTimestamp = Date.now();
    saveState();
  }

  function addLog(text) {
    const timeStr = `Day ${state.day} ${String(state.hour).padStart(2, '0')}:00`;
    state.logs.unshift({ time: timeStr, text });
    if (state.logs.length > 40) state.logs.pop();
  }

  function advanceTime(hoursToAdd, isManualSim = true) {
    for (let i = 0; i < hoursToAdd; i++) {
      state.hour += 1;
      if (state.hour >= 24) {
        state.hour = 0;
        state.day += 1;
        state.money += 1500;
        addLog(`💰 每日薪資入帳 +$1,500！`);
      }
      processHourTick(state.hour);
    }
    if (!isManualSim) state.lastTimestamp = Date.now();
    saveState();
  }

  function processHourTick(h) {
    if (h === 9) {
      state.isAtWork = true;
      state.isOvertimeToday = false;
      let msg = '背起包包出門上班去！';
      if (state.equipped.food) {
        const f = ITEMS_DB[state.equipped.food];
        state.stamina = Math.min(100, Math.max(0, state.stamina + f.effects.stamina));
        state.mood = Math.min(100, Math.max(0, state.mood + f.effects.mood));
        msg += ` 帶了【${f.name}】。`;
      }
      if (state.equipped.item) {
        msg += ` 隨身攜帶【${ITEMS_DB[state.equipped.item].name}】。`;
      }
      addLog(msg);
    }

    if (h === 14 && state.isAtWork) {
      const workEvents = eventsPool.filter(e => e.type === 'WORK_RANDOM');
      if (workEvents.length > 0) {
        const picked = weightedPick(workEvents, 1);
        state.mood = Math.min(100, Math.max(0, state.mood + (picked.moodDelta || 0)));
        state.stamina = Math.min(100, Math.max(0, state.stamina + (picked.staminaDelta || -10)));
        addLog(picked.log);
      } else {
        state.stamina = Math.max(0, state.stamina - 10);
        addLog('📱 [LINE動態] 下午開會開到眼神死，肝力 -10...');
      }
    }

    if (h === 18 && state.isAtWork) {
      let otChance = 0.40;
      let gtaMultiplier = 1;

      if (state.equipped.food) {
        otChance -= ITEMS_DB[state.equipped.food].effects.otReduce || 0;
        state.equipped.food = null;
      }
      if (state.equipped.item) {
        const it = ITEMS_DB[state.equipped.item];
        otChance -= it.effects.otReduce || 0;
        gtaMultiplier = it.effects.gtaBoost || 1;
        state.equipped.item = null;
      }

      if (Math.random() < Math.max(0.05, otChance)) {
        state.isOvertimeToday = true;
        addLog('⚠️ 18:00 警報！突發急件降臨，今天被迫加班了...');
      } else {
        state.isAtWork = false;
        triggerAfterWorkEvent(false, gtaMultiplier);
      }
    }

    if (h === 21 && state.isAtWork && state.isOvertimeToday) {
      state.isAtWork = false;
      triggerAfterWorkEvent(true, 1);
    }

    if (h === 1 && !state.isAtWork) {
      state.stamina = Math.min(100, state.stamina + 35);
      addLog('💤 進入深度睡眠，肝力回復 +35。');
    }
  }

  function weightedPick(candidates, gtaMultiplier) {
    let totalWeight = 0;
    const weightedList = candidates.map(evt => {
      let w = evt.baseWeight || 10;
      if (evt.isGtaEvent) w *= gtaMultiplier;
      totalWeight += w;
      return { evt, weight: w };
    });

    let randomVal = Math.random() * totalWeight;
    for (const item of weightedList) {
      if (randomVal < item.weight) return item.evt;
      randomVal -= item.weight;
    }
    return weightedList[0].evt;
  }

  function triggerAfterWorkEvent(isOvertime, gtaMultiplier) {
    if (isOvertime) {
      const otCandidates = eventsPool.filter(e => e.type === 'OVERTIME');
      const selected = otCandidates.length > 0 ? weightedPick(otCandidates, 1) : {
        title: '💻 系統大當機被迫加班',
        moneyDelta: 600,
        moodDelta: -18,
        staminaDelta: -25,
        avatar: '🦫💦',
        log: '加班到晚上九點才回家，賺了微薄加班費但靈魂已出竅...'
      };
      applyEventResult(selected);
      return;
    }

    const candidates = eventsPool.filter(e => {
      if (e.type !== 'AFTER_WORK') return false;
      if (state.mood < (e.minMood || 0)) return false;
      if (state.money < (e.minMoney || 0)) return false;
      return true;
    });

    const selected = candidates.length > 0 ? weightedPick(candidates, gtaMultiplier) : eventsPool[0];
    applyEventResult(selected);
  }

  function applyEventResult(evt) {
    state.money = Math.max(0, state.money + (evt.moneyDelta || 0));
    state.mood = Math.min(100, Math.max(0, state.mood + (evt.moodDelta || 0)));
    state.stamina = Math.min(100, Math.max(0, state.stamina + (evt.staminaDelta || 0)));

    if (evt.unlockDecor && !state.decorations.includes(evt.unlockDecor)) {
      state.decorations.push(evt.unlockDecor);
    }

    state.album.unshift({
      title: evt.title,
      time: `Day ${state.day} ${String(state.hour).padStart(2, '0')}:00`,
      desc: evt.log,
      avatar: evt.avatar || '🦫'
    });

    addLog(`🎉 【${evt.title}】${evt.log}`);
    document.getElementById('uiStatusText').textContent = `最新動態：${evt.log}`;
    document.getElementById('capyBubble').textContent = evt.title;
  }

  function renderUI() {
    document.getElementById('uiMood').textContent = `😊 ${state.mood}`;
    document.getElementById('uiStamina').textContent = `⚡ ${state.stamina}`;
    document.getElementById('uiMoney').textContent = `💰 ${state.money.toLocaleString()}`;
    document.getElementById('uiAlbumCount').textContent = state.album.length;

    const period = state.hour >= 6 && state.hour < 17 ? '白天' : (state.hour >= 17 && state.hour < 20 ? '黃昏' : '夜晚');
    document.getElementById('uiClock').textContent = `Day ${state.day} | ${String(state.hour).padStart(2, '0')}:00 (${period})`;

    const container = document.getElementById('gameContainer');
    container.className = 'game-container ' + (period === '黃昏' ? 'evening' : (period === '夜晚' ? 'night' : ''));
    document.getElementById('windowSkyIcon').textContent = period === '白天' ? '☀️' : (period === '黃昏' ? '🌇' : '🌙');

    // 戰利品與 PS5 實體顯示
    const decorEl = document.getElementById('uiDecor');
    decorEl.innerHTML = state.decorations.map(d => `<div class="decor-tag">✨ ${d}</div>`).join('');
    const hasPs5 = state.decorations.some(d => d.includes('PS5'));
    document.getElementById('furnPs5').style.display = hasPs5 ? 'block' : 'none';

    // 主角在房間 vs 出門上班的表現
    const sprite = document.getElementById('capySprite');
    const bubble = document.getElementById('capyBubble');
    if (state.isAtWork) {
      sprite.textContent = '📝';
      sprite.classList.remove('walking');
      bubble.textContent = state.isOvertimeToday ? '正在公司加班救火中...' : '出門上班囉！18:00 見！';
      document.getElementById('uiStatusText').textContent = '水豚出門上班了，桌上留了一張字條。';
    } else {
      sprite.textContent = (state.hour >= 0 && state.hour < 7) ? '🦫💤' : '🦫';
    }

    const logEl = document.getElementById('uiLogFeed');
    logEl.innerHTML = state.logs.map(l => `<div class="log-item"><span class="log-time">[${l.time}]</span>${l.text}</div>`).join('');

    const slotFood = document.getElementById('slotFood');
    const slotItem = document.getElementById('slotItem');
    if (state.equipped.food) {
      slotFood.classList.add('filled');
      document.getElementById('slotFoodName').textContent = ITEMS_DB[state.equipped.food].name;
    } else {
      slotFood.classList.remove('filled');
      document.getElementById('slotFoodName').textContent = '未配置';
    }
    if (state.equipped.item) {
      slotItem.classList.add('filled');
      document.getElementById('slotItemName').textContent = ITEMS_DB[state.equipped.item].name;
    } else {
      slotItem.classList.remove('filled');
      document.getElementById('slotItemName').textContent = '未配置';
    }
  }

  function openModal(id) {
    if (id === 'bagModal') renderInventory();
    if (id === 'shopModal') renderShop();
    if (id === 'albumModal') renderAlbum();
    document.getElementById(id).classList.add('show');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
  }

  function renderInventory() {
    const list = document.getElementById('inventoryList');
    const keys = Object.keys(state.inventory).filter(k => state.inventory[k] > 0);
    if (keys.length === 0) {
      list.innerHTML = '<div style="color:#636e72; font-size:13px;">背包空空的，快去便利商店採購吧！</div>';
      return;
    }
    list.innerHTML = keys.map(k => {
      const item = ITEMS_DB[k];
      return `
        <div class="item-row">
          <div>
            <strong>${item.name}</strong> (x${state.inventory[k]})
            <div style="font-size:11px; color:#636e72;">${item.desc}</div>
          </div>
          <button class="btn-action" onclick="equipItem('${k}')">裝備</button>
        </div>
      `;
    }).join('');
  }

  function equipItem(itemId) {
    if (state.isAtWork) {
      alert('水豚已經出門上班了，等他回家再準備明天的裝備吧！');
      return;
    }
    const item = ITEMS_DB[itemId];
    if (state.inventory[itemId] > 0) {
      if (state.equipped[item.type]) {
        const prev = state.equipped[item.type];
        state.inventory[prev] = (state.inventory[prev] || 0) + 1;
      }
      state.inventory[itemId] -= 1;
      state.equipped[item.type] = itemId;
      saveState();
      renderInventory();
    }
  }

  function renderShop() {
    const list = document.getElementById('shopList');
    list.innerHTML = Object.values(ITEMS_DB).map(item => `
      <div class="item-row">
        <div>
          <strong>${item.name}</strong> - $${item.price}
          <div style="font-size:11px; color:#636e72;">${item.desc}</div>
        </div>
        <button class="btn-action" onclick="buyItem('${item.id}')">購買</button>
      </div>
    `).join('');
  }

  function buyItem(itemId) {
    const item = ITEMS_DB[itemId];
    if (state.money >= item.price) {
      state.money -= item.price;
      state.inventory[itemId] = (state.inventory[itemId] || 0) + 1;
      addLog(`🛒 購買了【${item.name}】(-$${item.price})`);
      saveState();
    } else {
      alert('存款不足！先努力上班賺錢吧！');
    }
  }

  function renderAlbum() {
    const list = document.getElementById('albumList');
    if (state.album.length === 0) {
      list.innerHTML = '<div style="color:#636e72; font-size:13px;">尚未收集到任何寫真，快讓水豚去上班吧！</div>';
      return;
    }
    list.innerHTML = state.album.map(card => `
      <div class="postcard-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <strong>${card.title}</strong>
          <span style="font-size:11px; color:#636e72;">${card.time}</span>
        </div>
        <div style="font-size:36px; text-align:center; margin:8px 0;">${card.avatar}</div>
        <div style="font-size:13px; color:#2d3436;">${card.desc}</div>
      </div>
    `).join('');
  }

  initGame();
</script>
</body>
</html>
